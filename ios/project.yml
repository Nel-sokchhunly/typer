name: Typer
options:
  bundleIdPrefix: com.chhunly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ZKMSG7Z579
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Typer:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: TyperKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chhunly.typer
        PRODUCT_NAME: Typer
        INFOPLIST_KEY_CFBundleDisplayName: សរសេរ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  TyperKeyboard:
    type: app-extension
    platform: iOS
    # TyperCore's sources are compiled in directly: the package's TyperEngine system-library module
    # would clash with the xcframework's module of the same name.
    sources:
      - Keyboard
      - TyperCore/Sources/TyperCore
      - path: ../build/ios/data
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../build/ios/Typer.xcframework
        embed: false
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: "Typer (សរសេរ)"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: km-KH
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chhunly.typer.keyboard
        PRODUCT_NAME: TyperKeyboard
