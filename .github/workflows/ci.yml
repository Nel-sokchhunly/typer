name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # engine + data only; macOS runners are scarce, keep them for the release build
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2 # reuse compiled crates (Tauri is ~400); tags read main's cache
        with:
          workspaces: |
            engine -> target
      - run: python3 data/build.py
      - run: cargo test --release --manifest-path engine/Cargo.toml

  windows-check: # also builds the installer for v* tags
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2 # reuse compiled crates (Tauri is ~400); tags read main's cache
        with:
          workspaces: |
            windows -> target
            settings -> target
      - run: python data/build.py
      - run: rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
      - run: |
          for t in x86_64-pc-windows-msvc i686-pc-windows-msvc; do
            cargo build --release --manifest-path windows/Cargo.toml --target $t
          done
      - run: cargo build --release --manifest-path settings/Cargo.toml
      - name: Check DLL exports and runtime imports
        run: |
          pip install -q pefile
          python windows/check_dlls.py windows/target/{x86_64,i686}-pc-windows-msvc/release/typer_tsf.dll
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MSYS2_ARG_CONV_EXCL: "*" # keep Git Bash from turning /DVersion=... into a path
        run: |
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DVersion=${GITHUB_REF_NAME#v}" windows/installer.iss
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: windows-setup
          path: build/Typer-windows-setup.exe

  linux-check: # also builds the .deb for v* tags
    needs: test
    runs-on: ubuntu-22.04 # oldest supported glibc, so the .deb installs on 22.04+ and Debian 12
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2 # reuse compiled crates (Tauri is ~400); tags read main's cache
        with:
          workspaces: |
            engine -> target
            settings -> target
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libibus-1.0-dev ibus python3-gi gir1.2-ibus-1.0 dbus \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev
      - run: TYPER_VERSION="${GITHUB_REF_NAME#v}" linux/build.sh deb
        if: startsWith(github.ref, 'refs/tags/v')
      - run: linux/build.sh deb
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: End-to-end test through ibus-daemon
        run: |
          sudo apt-get install -y -qq ./build/Typer-linux-amd64.deb
          dbus-run-session -- sh -c 'ibus-daemon --panel=disable --daemonize && sleep 2 && python3 linux/test_ibus.py'
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: linux-deb
          path: build/Typer-linux-amd64.deb

  macos-check: # PRs / main only; on v* tags the release job builds macOS (universal pkg + zip)
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2 # reuse compiled crates (Tauri is ~400); tags read main's cache
        with:
          workspaces: |
            engine -> target
            settings -> target
      - run: macos/build.sh

  ios-changes: # path gate for ios-check; a workflow-wide `paths:` would gate every job
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3.0.2 # handles push and pull_request diffs; plain git diff needs per-event base logic
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'engine/**'
              - 'data/**'
              - '.github/workflows/ci.yml'

  ios-check: # macOS runners are scarce, so this only runs when iOS, engine or data change
    needs: ios-changes
    if: ${{ needs.ios-changes.outputs.ios == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2 # reuse compiled crates; tags read main's cache
        with:
          workspaces: |
            engine -> target
      - run: python3 data/build.py
      - run: python3 data/emoji.py
      - run: cargo build --release --manifest-path engine/Cargo.toml # host lib the TyperCore tests link against
      - run: swift test --package-path ios/TyperCore # Composer tests run on the macOS host
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - run: sh ios/build.sh # builds the engine xcframework and copies the data
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/Typer.xcodeproj -scheme Typer -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-check, linux-check]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2 # reuse compiled crates (Tauri is ~400); tags read main's cache
        with:
          workspaces: |
            engine -> target
            settings -> target
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Stamp version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $v" macos/Info.plist
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${{ github.run_number }}" macos/Info.plist
      - run: macos/build.sh dist
      - name: Build unsigned iOS IPA # re-sign with Sideloadly etc. to install
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          brew install xcodegen
          python3 data/emoji.py
          sh ios/build.sh ipa
          cp build/ios/Typer.ipa build/Typer-ios-unsigned.ipa
      - uses: actions/download-artifact@v5
        with:
          name: windows-setup
          path: build
      - uses: actions/download-artifact@v5
        with:
          name: linux-deb
          path: build
      - run: gh release create "$GITHUB_REF_NAME" build/Typer.pkg build/Typer-macos.zip build/Typer-windows-setup.exe build/Typer-linux-amd64.deb build/Typer-ios-unsigned.ipa --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
