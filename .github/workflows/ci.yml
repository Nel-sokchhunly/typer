name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 data/build.py
      - run: cargo test --release --manifest-path engine/Cargo.toml

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: python data/build.py
      - run: rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
      - run: |
          for t in x86_64-pc-windows-msvc i686-pc-windows-msvc; do
            cargo build --release --manifest-path windows/Cargo.toml --target $t
          done
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DVersion=${GITHUB_REF_NAME#v}" windows/installer.iss
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: windows-setup
          path: build/Typer-windows-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Stamp version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $v" macos/Info.plist
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${{ github.run_number }}" macos/Info.plist
      - run: macos/build.sh dist
      - uses: actions/download-artifact@v5
        with:
          name: windows-setup
          path: build
      - run: gh release create "$GITHUB_REF_NAME" build/Typer.pkg build/Typer-macos.zip build/Typer-windows-setup.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
