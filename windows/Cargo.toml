[package]
name = "typer-windows"
version = "0.1.0"
edition = "2021"

[lib]
name = "typer_tsf"
crate-type = ["cdylib"]

[dependencies]
typer = { path = "../engine" }
windows-core = "=0.58.0"

[dependencies.windows]
version = "=0.58.0"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
